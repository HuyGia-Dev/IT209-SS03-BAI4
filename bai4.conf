# 1. Cấu hình Nginx Server Blocks (/etc/nginx/sites-available/multi-port.conf)
server {
    listen 8080;
    server_name _;

    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8090;
    server_name _;

    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# =================================================================
# 2. Hướng dẫn lệnh thực hiện trên server & tạo các tệp HTML:
# =================================================================
#
# -- Tạo thư mục lưu trữ mã nguồn --
# sudo mkdir -p /var/www/beta-app/html
# sudo mkdir -p /var/www/internal-app/html
#
# -- Tạo file /var/www/beta-app/html/index.html --
# <!DOCTYPE html>
# <html>
# <head><title>Beta App</title></head>
# <body><h1>Welcome to Beta App (Port 8080)</h1></body>
# </html>
#
# -- Tạo file /var/www/internal-app/html/index.html --
# <!DOCTYPE html>
# <html>
# <head><title>Internal App</title></head>
# <body><h1>Welcome to Internal App (Port 8090)</h1></body>
# </html>
#
# -- Kích hoạt cấu hình Nginx --
# sudo ln -s /etc/nginx/sites-available/multi-port.conf /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx
#
# -- Cấu hình tường lửa UFW mở cổng 8080 và 8090 --
# sudo ufw allow 8080/tcp
# sudo ufw allow 8090/tcp
# sudo ufw reload